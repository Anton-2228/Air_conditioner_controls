services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ac_mosquitto
    restart: unless-stopped
    ports:
      # Наружу: плата стоит дома и подключается к брокеру через интернет
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  bot:
    build: .
    container_name: ac_bot
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file: .env
    environment:
      # Внутри compose-сети бот ходит к брокеру напрямую, наружу не выходит
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      STATE_FILE_PATH: /data/state.json
    volumes:
      - bot_state:/data

volumes:
  mosquitto_data:
  mosquitto_log:
  bot_state:
